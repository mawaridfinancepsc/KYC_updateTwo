<!DOCTYPE html>
<html>
<head>
    <title>Submission Status</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background-color: #f9f9f9;
        }
        .container {
            text-align: center;
            background: #fff;
            padding: 30px 50px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        img.logo {
            max-width: 200px;
            margin-bottom: 20px;
        }
        p { 
            font-size: 18px; 
            font-weight: bold; 
            color: #2c3e50; 
            margin-top: 20px;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Company Logo" class="logo">

        <p class="{{ status }}">{{ message }}</p>
    </div>
</body>
</html>
