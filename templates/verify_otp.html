
<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background-color: #f9f9f9;
        }
        .container {
            text-align: center;
            background: #fff;
            padding: 30px 50px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        img.logo {
            max-width: 200px;
            margin-bottom: 20px;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 16px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 2px;
        }
        button {
            width: 100%;
            background: #007BFF;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #0056b3;
        }
        .flash {
            margin-bottom: 15px;
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Logo -->
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Company Logo" class="logo">

        <h2>OTP Verification</h2>
        <p>Please enter the 4-digit OTP sent to your mobile number.</p>

        <!-- Flash message -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- OTP Form -->
        <form method="POST" action="/verify_otp">
            <input type="hidden" name="phone" value="{{ phone }}">
            <input type="hidden" name="lead_id" value="{{ lead_id }}">
            
            <input type="text" name="otp" required maxlength="4">
            <button type="submit">Verify OTP</button>
        </form>
    </div>
</body>
</html>
